name: Build Shams Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.shams.cardboard \
            --project-name cardboard_app \
            /tmp/cardboard_scaffold
          cp -R /tmp/cardboard_scaffold/android "$GITHUB_WORKSPACE/android"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shams-Cardboard-APK
          path: build/app/outputs/flutter-apk/app-release.apk
